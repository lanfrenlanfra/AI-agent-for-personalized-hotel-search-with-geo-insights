# Реестр характеристик.
#
# Чтобы добавить новую характеристику, достаточно описать её здесь (или через
# POST /api/features): ключ, название, тип, синонимы для поиска и — по желанию —
# шаблоны для отзывов и вопрос отельеру. Код менять не нужно: реестр сразу
# подхватывают сбор по отзывам, диалог с отельером, поиск и интерфейс.
#
# Поля:
#   kind        bool | score (0-100) | number | text
#   good        для score/number: high — чем больше, тем лучше; low — чем меньше, тем лучше
#   ttl_days    через сколько дней значение считается устаревшим
#   importance  0..1 — насколько важно спросить отельера, если данных нет
#   synonyms    основы слов для разбора поискового запроса (русский/английский)
#   review.pos  шаблоны отзывов, подтверждающие «да / хорошо»
#   review.neg  шаблоны отзывов, опровергающие «нет / плохо»
#               (перед шаблоном «!» отключает автоматический учёт отрицания)
#   computed    характеристика считается по геоданным, а не по тексту
#   question    вопрос отельеру, если данных нет или они противоречат друг другу

features:
  # ───────────── Вид из окна ─────────────
  - key: sunset_view
    title: "Закат из окна"
    group: view
    kind: bool
    computed: true
    ttl_days: 365
    importance: 0.8
    description: "Видно ли заходящее солнце из окон и с какого этажа. Считается по 3D-модели кварталов (OpenStreetMap) и положению солнца на каждый месяц."
    synonyms: [закат, закат солнца, sunset, вечернее солнце, багров]
    review:
      pos: ['закат\w*\s+(?:виден|видно|смотрел|любовал|наблюда|встречал|провожал)', 'вид\w*\s+на\s+закат', 'на\s+закат\w*\s+(?:смотр|любов)', '!закат\w*\s+(?:из\s+окна\s+)?(?:был\s+)?(?:прекрасен|потряса|шикарн|красив)']
      neg: ['!закат\w*[^.;]{0,25}\bне\s+вид', '!закат\w*[^.;]{0,25}\bне\s+наблюда', '!солнц\w*\s+нет\b', '!окна\s+на\s+(?:север|стену)']
    question: "Какие номера и с какого этажа выходят на запад или северо-запад? Видно ли закат из окон?"

  - key: landmark_view
    title: "Вид на достопримечательность"
    group: view
    kind: bool
    computed: true
    ttl_days: 365
    importance: 0.7
    description: "Прямая видимость до главных достопримечательностей города с учётом высоты зданий между окном и целью."
    synonyms: [вид на, достопримечательност, панорам, виды города, скала, шаманк, камень черского, шаман-камень, шпиль, собор, крепост, дворец, sight, view]
    review:
      pos: ['вид\w*\s+на\s+(?:шаманк|скал\w+|мыс\w*|хребет|хребт\w+|горы|горн\w+|сопк\w+|исаак|эрмитаж|казанск|собор|крепост|шпил|адмиралтейств|дворц\w+\s+площад|петропавловск|спас)', 'панорам\w+\s+(?:вид|города|на\s+город)', 'вид\w*\s+на\s+(?:крыши|город)']
      neg: ['!вид\w*\s+на\s+(?:стен|брандмауэр|колодец|помойк|мусорк)', '!окна\s+(?:выходят\s+)?на\s+стену', '!вид\w*\s+из\s+окна\s+(?:ужасн|никак|отсутств)']
    question: "Из каких номеров видны достопримечательности города (какие именно и с какого этажа)?"

  - key: water_view
    title: "Вид на озеро"
    group: view
    kind: bool
    computed: true
    ttl_days: 365
    importance: 0.6
    description: "Видны ли озеро, река или залив из окон (зимой — ледяной покров) и с какого этажа."
    synonyms: [вид на байкал, вид на озеро, на озеро, у озера, озер, на байкал, на лёд, на лед, вид на неву, вид на реку, вид на канал, на воду, на залив, на море, у воды, river, канал, нев]
    review:
      pos: ['вид\w*\s+(?:из\s+окна\s+)?на\s+(?:байкал|озер\w+|лёд|лед|воду|реку|залив|море|канал|неву|ангар\w+)', 'окна\s+(?:выходят\s+)?на\s+(?:байкал|озер\w+|воду|реку|залив|ангар\w+|канал|неву)', 'байкал\w*\s+(?:виден|видно|из\s+окна)', 'вид\w*\s+(?:на\s+)?(?:фонтанк|мойку)']
      neg: ['!вид\w*\s+на\s+(?:стен|брандмауэр|колодец)', '!вида\s+на\s+(?:воду|реку|канал|неву)\s+нет', '!не\s+вид\w+\s+(?:воды|реки|канала|невы)']
    question: "Есть ли номера с видом на реку, канал или залив?"

  # ───────────── Шум ─────────────
  - key: quiet
    title: "Тишина"
    group: noise
    kind: score
    good: high
    computed: true
    ttl_days: 180
    importance: 0.9
    description: "Оценка тишины 0–100 с каждой стороны здания по дорогам, трамваям, железной дороге и ночным заведениям рядом, плюс отзывы гостей."
    synonyms: [тихо, тихи, тиха, тихе, тишин, не шумн, спокойн, выспа, шума нет, без шума, quiet, спать, сон]
    review:
      pos: ['тих[оиа]', 'тишин', 'спокойн', 'не\s+слыш(?:но|на|ны|ен)', 'окна\s+(выходят\s+)?во\s+двор', '!выспал', '!хорошо\s+спал']
      neg: ['шумн', '\bшум\b', 'громк', 'слыш(?:но|на|ны|ен)\s+(улиц|соседей|музык|трамва|машин|клуб|бар|всё|все)', 'орут', 'дискотек', 'под\s+окнами', 'вечеринк', '!не\s+выспал', '!плохо\s+спал', 'стен[ыа]\s+тонк']
    question: "Какие номера самые тихие (во двор или на улицу)? Что шумит рядом ночью — бары, трамвай, дорога?"

  - key: soundproof_windows
    title: "Шумоизоляция окон"
    group: noise
    kind: bool
    ttl_days: 365
    importance: 0.6
    description: "Есть ли стеклопакеты или шумоизоляция в номерах."
    synonyms: [шумоизоляц, стеклопакет, звукоизоляц, soundproof]
    review:
      pos: ['шумоизоляц\w*\s+(хорош|отличн|отлично)', 'стеклопакет', 'хорошая\s+(звуко|шумо)изоляц', 'окна\s+не\s+пропускают\s+шум', '!ничего\s+не\s+слышн']
      neg: ['(звуко|шумо)изоляц\w*\s+(плох|никак|нулев|ужасн)', '!слышно\s+каждый', 'тонкие\s+стен', 'тонкие\s+окна']
    question: "Есть ли в номерах стеклопакеты или другая шумоизоляция окон?"

  - key: blackout_curtains
    title: "Плотные шторы"
    group: noise
    kind: bool
    ttl_days: 365
    importance: 0.5
    description: "Затемняют ли шторы номер — важно в белые ночи и после дороги."
    synonyms: [плотн штор, блэкаут, затемнен, шторы, blackout, светонепроницаем]
    review:
      pos: ['плотн\w*\s+штор', 'блэкаут', 'блекаут', 'blackout', 'затемнен', 'темно\s+(ночью|в\s+номере)']
      neg: ['тонк\w*\s+штор', 'светл\w*\s+штор', 'шторы\s+(не\s+закрыва|просвечива|тонкие)', 'свет\s+(с\s+улицы|фонар)', 'не\s+хватает\s+штор']
    question: "Есть ли в номерах плотные шторы или ставни, которые полностью затемняют комнату?"

  # ───────────── Окружение ─────────────
  - key: night_services
    title: "Что работает ночью"
    group: surroundings
    kind: number
    unit: мест
    good: high
    computed: true
    ttl_days: 120
    importance: 0.4
    description: "Сколько круглосуточных аптек, магазинов и кафе в 500 м (по opening_hours из OpenStreetMap)."
    synonyms: [ночью, круглосуточ, 24/7, ночн аптек, ночн магазин, поздно]
    question: "Где ближайшие круглосуточные аптека и магазин?"

  - key: family_friendly
    title: "Для семей с детьми"
    group: surroundings
    kind: score
    good: high
    computed: true
    ttl_days: 180
    importance: 0.6
    description: "Детские площадки, пешеходные улицы и детская больница рядом, плюс детские политики отеля."
    synonyms: [с детьми, ребён, ребенк, дет, семь, площадк, family, kids, малыш]
    review:
      pos: ['с\s+детьми', 'с\s+ребёнком', 'с\s+ребенком', 'детск\w+\s+площадк', 'для\s+детей', 'семейн']
      neg: ['не\s+для\s+детей', 'с\s+детьми\s+(неудобно|сложно|не\s+подходит)', '!нет\s+лифта']
    question: "Есть ли детские кроватки, детское меню и что предложить семье с ребёнком рядом с отелем?"

  - key: walk_to_metro
    title: "Пешком до метро"
    group: surroundings
    kind: number
    unit: мин
    good: low
    computed: true
    ttl_days: 365
    importance: 0.3
    description: "Время пешком до ближайшей станции метро по реальным пешеходным путям, а не по прямой; отмечает, нужно ли переходить оживлённую магистраль."
    synonyms: [метро, у метро, рядом с метро, subway, metro, станци]

  - key: walk_to_center
    title: "Пешком до центра"
    group: surroundings
    kind: number
    unit: мин
    good: low
    computed: true
    ttl_days: 365
    importance: 0.2
    description: "Время пешком до центра города (Дворцовая площадь)."
    synonyms: [центр, в центре, центре города, рядом с центром, downtown]

  - key: walk_to_water
    title: "Пешком до воды"
    group: surroundings
    kind: number
    unit: мин
    good: low
    computed: true
    ttl_days: 365
    importance: 0.2
    description: "Время пешком до ближайшей реки, канала или залива."
    synonyms: [у воды, рядом с водой, набережн, у реки, у канала, у озера, у байкала, у берега]

  - key: walk_to_beach
    title: "Пешком до берега"
    group: surroundings
    kind: number
    unit: мин
    good: low
    computed: true
    ttl_days: 365
    importance: 0.2
    description: "Время пешком до ближайшего пляжа или берега озера и залива."
    synonyms: [пляж, море, у моря, недалеко от моря, берег, залив, у озера, у байкала, на берегу, beach, sea, купат]

  - key: parking
    title: "Парковка"
    group: surroundings
    kind: bool
    ttl_days: 365
    importance: 0.5
    description: "Есть ли парковка у отеля (по карточке, отзывам и парковкам рядом по OpenStreetMap)."
    synonyms: [парковк, машин, авто, припарковат, parking, car, на машине]
    review:
      pos: ['есть\s+парковк', 'парковк\w*\s+(есть|рядом|бесплатн|во\s+дворе)', 'припарковал', 'оставил\w*\s+машин']
      neg: ['нет\s+парковк', 'парковк\w*\s+(нет|отсутству|проблем)', 'негде\s+парков', 'проблем\w*\s+с\s+парковк', '!сложно\s+припарков']
    question: "Есть ли парковка у отеля? Платная ли, нужно ли бронировать место, как проехать?"

  - key: ev_charging_near
    title: "Зарядка для электромобилей рядом"
    group: surroundings
    kind: bool
    computed: true
    ttl_days: 120
    importance: 0.2
    description: "Есть ли зарядные станции в 500 м."
    synonyms: [электромобил, зарядк, tesla, ev, электрокар]

  - key: pedestrian_zone
    title: "Пешеходная зона у входа"
    group: surroundings
    kind: bool
    computed: true
    ttl_days: 365
    importance: 0.3
    description: "Находится ли вход в пешеходной зоне, куда нельзя подъехать на машине."
    synonyms: [пешеходн, подъехать, подъезд]

  - key: construction_nearby
    title: "Стройка рядом"
    group: surroundings
    kind: bool
    computed: true
    ttl_days: 30
    importance: 0.7
    description: "Есть ли в 300 м строящиеся здания или дорожные работы (по OpenStreetMap и отзывам). Данные устаревают быстро — проверяются раз в месяц."
    synonyms: [стройк, строительств, ремонт, работы рядом, construction, перфоратор]
    review:
      pos: ['!стройк', '!строительств\w+\s+(рядом|напротив|во\s+дворе|под\s+окнами)', '!ремонт\s+(на\s+улице|во\s+дворе|напротив|фасад)', 'перфоратор', 'отбойн', 'дорожн\w+\s+работ']
      neg: []
    question: "Ведутся ли рядом стройка или ремонт? В какие часы шумят и до какой даты?"

  - key: historic_building
    title: "Историческое здание"
    group: surroundings
    kind: bool
    computed: true
    ttl_days: 730
    importance: 0.1
    description: "Здание старше 100 лет или памятник архитектуры (по тегам OpenStreetMap: start_date, heritage)."
    synonyms: [исторически, старинн, памятник, особняк, дом, модерн, heritage, ретро, дореволюцион]

  - key: white_nights
    title: "Белые ночи"
    group: surroundings
    kind: bool
    computed: true
    ttl_days: 730
    importance: 0.0
    description: "Период, когда солнце уходит под горизонт не глубже 9° и ночью светло. Считается по широте."
    synonyms: [белые ночи, белых ночей, светлые ночи, white nights]

  # ───────────── В номере и сервис (карточка + отзывы + отельер) ─────────────
  - key: elevator
    title: "Лифт"
    group: guests
    kind: bool
    ttl_days: 365
    importance: 0.8
    description: "Есть ли лифт. Часто меняется после ремонта и расходится с карточкой."
    synonyms: [лифт, без ступеней, подним, elevator, lift, коляск]
    review:
      pos: ['есть\s+лифт', 'лифт\w*\s+(есть|работает|удобн|быстр)', 'на\s+лифте', 'поднял\w+\s+на\s+лифте']
      neg: ['нет\s+лифт', 'без\s+лифт', 'лифт\w*\s+(нет|отсутству|не\s+работ|сломан)', 'отсутстви\w+\s+лифт', 'пешком\s+на\s+\d', 'высоко\s+подниматься', 'крутая\s+лестниц', '!тяжело\s+(с\s+чемодан|поднимать)']
    question: "Есть ли лифт и до какого этажа он ходит? Как подняться с чемоданом?"

  - key: air_conditioning
    title: "Кондиционер"
    group: guests
    kind: bool
    ttl_days: 365
    importance: 0.5
    description: "Работает ли кондиционер в номерах."
    synonyms: [кондиционер, прохлад, жарк, духот, air condition, ac, жара]
    review:
      pos: ['кондиционер\w*\s+(есть|работает|исправн|хорош)', 'есть\s+кондиционер', 'прохладно']
      neg: ['нет\s+кондиционер', 'без\s+кондиционер', 'кондиционер\w*\s+(нет|не\s+работ|сломан|шумн)', 'душно', 'духота', '!жарко\s+(в\s+номере|ночью)']
    question: "Есть ли кондиционер в каждом номере и работает ли он?"

  - key: heating_ok
    title: "Тепло в номере"
    group: guests
    kind: score
    good: high
    ttl_days: 180
    importance: 0.5
    description: "Достаточно ли тепло в холодный сезон."
    synonyms: [тепл, отоплен, холодно, мёрзн, мерзн, батаре, heating]
    review:
      pos: ['тепло\s+(в\s+номере|и\s+уютно)', 'батаре\w+\s+(горяч|тёпл|теплые)', 'отоплен\w+\s+(хорош|работает)', '!в\s+номере\s+тепло']
      neg: ['холодно', 'мёрзли', 'мерзли', 'батаре\w+\s+(холодн|не\s+греет|еле)', 'не\s+топят', 'дует', 'сквозняк']
    question: "Как отапливаются номера зимой? Можно ли регулировать температуру?"

  - key: wifi_quality
    title: "Качество Wi-Fi"
    group: guests
    kind: score
    good: high
    ttl_days: 180
    importance: 0.6
    description: "Скорость и стабильность Wi-Fi по оценкам гостей — важно для удалённой работы."
    synonyms: [wifi, wi-fi, вай-фай, вайфай, интернет, удалённ, удаленн, работать, ноутбук, remote]
    review:
      pos: ['wi-?fi\s+(отличн|хорош|быстр|стабильн)', 'интернет\s+(отличн|хорош|быстр|стабильн)', 'быстрый\s+(интернет|wi-?fi)', 'вай-?фай\s+(отличн|хорош|быстр)']
      neg: ['wi-?fi\s+(плох|медлен|слаб|не\s+работ|глючит|ужасн)', 'интернет\s+(плох|медлен|слаб|не\s+работ|глючит)', 'слабый\s+(интернет|wi-?fi)', 'вай-?фай\s+(плох|медлен|слаб|не\s+работ)', '!нет\s+wi-?fi']
    question: "Какая скорость интернета в номерах и стабилен ли Wi-Fi? Можно ли комфортно работать удалённо?"

  - key: breakfast_quality
    title: "Завтрак"
    group: guests
    kind: score
    good: high
    ttl_days: 120
    importance: 0.3
    description: "Оценка завтрака по отзывам."
    synonyms: [завтрак, питани, breakfast, кормят, шведск, поесть]
    review:
      pos: ['завтрак\w*\s+(вкусн|отличн|хорош|разнообразн|шведск)', 'вкусные\s+завтрак', 'отличные\s+завтрак', 'шведск\w+\s+стол']
      neg: ['завтрак\w*\s+(скудн|невкусн|однообразн|простой|плох|ужасн|не\s+разнообразн)', 'скудные\s+завтрак', '!завтрак\w*\s+не\s+(очень|шведск|понрав)', 'завтрак\w*\s+нет']
    question: "Что входит в завтрак, во сколько он и как он оценивается гостями?"

  - key: cleanliness
    title: "Чистота"
    group: guests
    kind: score
    good: high
    ttl_days: 120
    importance: 0.2
    description: "Оценка чистоты по свежим отзывам."
    synonyms: [чисто, чистот, clean, гигиен, уборк]
    review:
      pos: ['чисто', 'чистот\w+\s+(отличн|идеальн|на\s+высоте)', 'идеальн\w+\s+чист', 'всегда\s+чисто', 'уборк\w+\s+(каждый\s+день|отличн)']
      neg: ['грязн', 'пыльн', 'неряшлив', 'нечисто', 'плесен', 'тараканы', 'клопы', 'пятн\w+\s+на\s+(белье|постел|матрас)']
    question: "Как часто убираются номера и меняется бельё?"

  - key: bed_comfort
    title: "Удобство кровати"
    group: guests
    kind: score
    good: high
    ttl_days: 180
    importance: 0.2
    description: "Оценка кровати и матраса по отзывам."
    synonyms: [кроват, матрас, постел, bed, спать, удобн кроват]
    review:
      pos: ['кроват\w*\s+(удобн|мягк|огромн|больш)', 'матрас\w*\s+(удобн|хорош|ортопедическ)', 'удобные\s+кроват', 'удобный\s+матрас']
